<div class="mx-auto mt-4 max-w-3xl px-2">
  <div class="overflow-hidden rounded-lg bg-white shadow-sm ring-1 ring-gray-200">
    <div class="border-b border-gray-200 bg-white px-4 py-3">
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex-1">
          <h1 class="text-xl font-semibold" id="catalog-heading">Library Catalog</h1>
        </div>
        <div class="w-full sm:w-1/2">
          <search>
            <label for="bookSearch" class="mb-1 block text-sm text-gray-600">
              Search books by title
            </label>
            <div class="flex rounded-md border border-gray-300 focus-within:border-blue-500">
              <span
                class="flex items-center border-r-0 bg-gray-50 px-2 text-gray-500"
                aria-hidden="true"
              >
                🔍
              </span>
              <input
                id="bookSearch"
                type="text"
                class="w-full rounded-r-md px-2 py-1.5 outline-none"
                placeholder="Search title"
                [value]="store.filter.query()"
                (input)="onUpdateQuery($any($event.target).value)"
                aria-describedby="searchHelp"
              />
            </div>
            <div id="searchHelp" class="sr-only">Results update automatically as you type.</div>
          </search>
        </div>
      </div>
    </div>

    <div class="sr-only" aria-live="polite">{{ store.visibleBooks().length }} books found.</div>

    <div class="overflow-x-auto">
      <button type="button" class="skip-table-link" (click)="skipToEnd($event, tableEnd)">
        Skip book list
      </button>
      <table class="w-full text-left" aria-labelledby="catalog-heading">
        <thead class="bg-gray-50 text-sm text-gray-700">
          <tr>
            <th scope="col" class="px-4 py-2 w-[10%]">ID</th>
            <th
              scope="col"
              class="px-4 py-2"
              [attr.aria-sort]="store.filter.order() === 'asc' ? 'ascending' : 'descending'"
            >
              <button
                #changeOrderButton
                type="button"
                class="flex items-center font-bold text-gray-900"
                (click)="onChangeOrder()"
                aria-label="Sort by title"
              >
                Title
                <span class="ml-1" aria-hidden="true">
                  {{ store.filter.order() === 'asc' ? '↑' : '↓' }}
                </span>
              </button>
            </th>
            <th scope="col" class="px-4 py-2 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          @for (book of store.visibleBooks(); track book.id) {
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2">
              <span class="text-sm text-gray-500">#{{ book.id }}</span>
            </td>
            <td class="px-4 py-2 font-bold">{{ book.title }}</td>
            <td class="px-4 py-2 text-right whitespace-nowrap">
              <a
                class="inline-flex items-center rounded-md border border-blue-600 px-2.5 py-1 text-sm text-blue-600 transition-colors hover:bg-blue-50"
                [routerLink]="[book.id]"
                [attr.aria-label]="'Read book: ' + book.title"
              >
                Read
              </a>
              <button
                class="ml-1 inline-flex items-center rounded-md border border-blue-600 px-2.5 py-1 text-sm text-blue-600 transition-colors hover:bg-blue-50"
                (click)="selectBook(book.id)"
                [attr.aria-label]="'Edit book: ' + book.title"
              >
                Edit
              </button>
              <button
                class="ml-1 inline-flex items-center rounded-md border border-red-600 px-2.5 py-1 text-sm text-red-600 transition-colors hover:bg-red-50"
                (click)="deleteBook(book)"
                [attr.aria-label]="'Delete book: ' + book.title"
              >
                Delete
              </button>
            </td>
          </tr>
          } @empty {
          <tr>
            <td colspan="3" class="px-4 py-12 text-center text-gray-500">
              <p role="status">No books found matching "{{ store.filter.query() }}"</p>
            </td>
          </tr>
          }
        </tbody>
      </table>
      <div #tableEnd id="table-end" tabindex="-1"></div>
    </div>
  </div>
</div>

<app-delete-book-modal></app-delete-book-modal>
