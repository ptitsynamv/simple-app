@if (isModalOpen) {
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
  id="confirm-book-deletion"
  tabindex="-1"
  aria-labelledby="delete-book-modal"
  aria-describedby="delete-desc"
  role="alertdialog"
  aria-modal="true"
  cdkTrapFocus
  cdkTrapFocusAutoCapture="true"
>
  <div class="w-full max-w-md overflow-hidden rounded-lg bg-white shadow-xl">
    <div class="flex items-center justify-between border-b border-gray-200 px-6 py-4">
      <h1 class="text-lg font-semibold" id="delete-book-modal">Confirm Book Deletion</h1>
      <button
        type="button"
        class="text-2xl leading-none text-gray-500 hover:text-gray-800"
        aria-label="Close"
        (click)="handleCancel()"
      >
        &times;
      </button>
    </div>
    <div class="px-6 py-4" id="delete-desc">
      <p>
        Are you sure you want to delete <strong>{{ book?.title }}</strong
        >? This action cannot be undone.
      </p>
    </div>
    <div class="flex justify-end gap-2 px-6 py-4">
      <button
        type="button"
        class="rounded-md border border-gray-300 bg-gray-100 px-4 py-2 text-gray-800 transition-colors hover:bg-gray-200"
        (click)="handleCancel()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="rounded-md bg-red-600 px-4 py-2 font-medium text-white transition-colors hover:bg-red-700"
        (click)="confirmDelete()"
        cdkFocusInitial
      >
        Delete Book
      </button>
    </div>
  </div>
</div>
}
