<div class="mx-auto mt-8 max-w-md px-4">
  <div class="rounded-lg bg-white shadow-sm ring-1 ring-gray-200">
    <div class="p-8 text-center">
      <h1 class="mb-4 text-2xl font-semibold text-gray-600">SignalStore Counter</h1>

      <div class="mb-2 text-7xl font-bold text-blue-600" aria-live="polite" aria-atomic="true">
        {{ store.count() }}
      </div>
      <p class="mb-4 text-gray-500">
        Double value:
        <span class="inline-block rounded bg-cyan-100 px-2 py-0.5 text-cyan-800">{{
          store.doubleCount()
        }}</span>
      </p>

      <div class="flex justify-center gap-2">
        <button
          (click)="store.decrement()"
          class="inline-flex items-center rounded-md border border-red-600 px-4 py-2 text-lg text-red-600 transition-colors hover:bg-red-50"
          [attr.aria-disabled]="store.count() === 0"
          [attr.aria-label]="
            store.count() === 0 ? 'Decrement disabled: count is already zero' : 'Decrement counter'
          "
          type="button"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path fill-rule="evenodd" d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8" />
          </svg>
        </button>

        <button
          (click)="store.reset()"
          class="inline-flex items-center rounded-md border border-gray-300 bg-gray-100 px-4 py-2 text-lg text-gray-800 transition-colors hover:bg-gray-200"
          aria-label="Reset counter to zero"
          type="button"
        >
          Reset
        </button>

        <button
          (click)="store.increment()"
          class="inline-flex items-center rounded-md bg-blue-600 px-4 py-2 text-lg text-white transition-colors hover:bg-blue-700"
          aria-label="Increment counter"
          type="button"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
