<footer class="mt-auto bg-gray-100 py-12">
  <div class="mx-auto max-w-7xl px-4">
    <div class="flex flex-wrap items-center">
      <div class="w-full text-center md:w-1/2 md:text-left">
        <p class="mb-0 text-gray-600">
          &copy; 2026 <span class="font-bold">Simple App</span>. {{ 'footer.tagline' | transloco }}
        </p>
        <nav [attr.aria-label]="'footer.nav' | transloco">
          <ul class="mt-2 mb-0 flex flex-wrap justify-center gap-4 md:justify-start">
            <li>
              <a href="#" class="text-gray-500 no-underline hover:text-gray-700">{{
                'footer.privacy' | transloco
              }}</a>
            </li>
            <li>
              <a href="#" class="text-gray-500 no-underline hover:text-gray-700">{{
                'footer.accessibility' | transloco
              }}</a>
            </li>
          </ul>
        </nav>
      </div>

      <div class="mt-4 w-full text-center md:mt-0 md:w-1/2 md:text-right">
        <button
          type="button"
          class="inline-flex items-center gap-1 rounded-md border border-gray-400 px-3 py-1.5 text-sm text-gray-700 transition-colors hover:bg-gray-200"
          (click)="scrollToTop()"
          [attr.aria-label]="'footer.backToTopAria' | transloco"
        >
          ↑ {{ 'footer.backToTop' | transloco }}
        </button>
      </div>
    </div>
  </div>
</footer>
